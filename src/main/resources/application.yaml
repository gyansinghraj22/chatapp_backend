spring:
  application:
    name: chatapp_backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatapp}
    username: ${DB_USERNAME:gyan}
    password: ${DB_PASSWORD:gyan@password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/chat-migration
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MEDIA_MAX_FILE_SIZE:15MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:16MB}
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret-base64: ${JWT_SECRET:}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
    password-reset-enabled: ${PASSWORD_RESET_EMAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:no-reply@localhost}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  media:
    backend: ${MEDIA_BACKEND:local}
    local-root: ${MEDIA_LOCAL_ROOT:./uploads}
    max-file-bytes: ${MEDIA_MAX_FILE_BYTES:15728640}
    s3:
      bucket: ${MEDIA_S3_BUCKET:}
      region: ${MEDIA_S3_REGION:us-east-1}
      endpoint: ${MEDIA_S3_ENDPOINT:}
      path-style-access: ${MEDIA_S3_PATH_STYLE:true}
  notifications:
    firebase:
      enabled: ${FIREBASE_ENABLED:false}
      credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
      project-id: ${FIREBASE_PROJECT_ID:}
    token-encryption-key: ${FCM_TOKEN_ENCRYPTION_KEY:}
    dispatch:
      enabled: ${NOTIFICATION_DISPATCH_ENABLED:true}
      interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:5000}
      batch-size: ${NOTIFICATION_DISPATCH_BATCH_SIZE:50}
