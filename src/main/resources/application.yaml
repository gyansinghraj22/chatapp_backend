spring:
  application:
    name: chatapp_backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatapp}
    username: ${DB_USERNAME:gyan}
    password: ${DB_PASSWORD:gyan@password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/chat-migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MEDIA_MAX_FILE_SIZE:15MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:16MB}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-base64: ${JWT_SECRET:}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  media:
    backend: ${MEDIA_BACKEND:local}
    local-root: ${MEDIA_LOCAL_ROOT:./uploads}
    max-file-bytes: ${MEDIA_MAX_FILE_BYTES:15728640}
    s3:
      bucket: ${MEDIA_S3_BUCKET:}
      region: ${MEDIA_S3_REGION:us-east-1}
      endpoint: ${MEDIA_S3_ENDPOINT:}
      path-style-access: ${MEDIA_S3_PATH_STYLE:true}
