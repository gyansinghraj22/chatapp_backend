spring:
  application:
    name: chatapp_backend

  datasource:
    url: jdbc:postgresql://localhost:5432/chatapp
    username: gyan
    password: gyan@password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080