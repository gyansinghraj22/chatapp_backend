spring:
  application:
    name: chatapp_backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatapp}
    username: ${DB_USERNAME:gyan}
    password: ${DB_PASSWORD:gyan@password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}
